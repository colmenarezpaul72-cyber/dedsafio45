name: Compilar Dedsafio 4
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Compilar
        run: gradle build --no-daemon
      - name: Unir los mods originales (solo si hay .jar en la carpeta originales/)
        run: |
          if ls originales/*.jar >/dev/null 2>&1; then
            python3 tools/unir_jars.py build/libs/dedsafio4-1.0.0.jar originales build/libs/dedsafio4-COMPLETO.jar
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dedsafio4
          path: |
            build/libs/dedsafio4-1.0.0.jar
            build/libs/dedsafio4-COMPLETO.jar
          if-no-files-found: ignore
